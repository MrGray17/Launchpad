name: Critical Windows Gate

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

concurrency:
  group: critical-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and bundle
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run React workflow tests with coverage gates
        run: npm run test:coverage

      - name: Build typed frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Reject Rust warnings
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build Windows installers
        run: npm run tauri build

      - name: Smoke-test release executable
        shell: powershell
        run: ./scripts/smoke-release.ps1

      - name: Upload installer evidence
        uses: actions/upload-artifact@v4
        with:
          name: launchpad-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
